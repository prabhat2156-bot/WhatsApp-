<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILENT OWNER</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#050505;
}

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    linear-gradient(90deg,transparent 49%,rgba(0,255,255,.08) 50%,transparent 51%),
    linear-gradient(transparent 49%,rgba(0,255,255,.08) 50%,transparent 51%);
    background-size:60px 60px;
    animation:grid 6s linear infinite;
}

@keyframes grid{
    from{transform:perspective(700px) rotateX(70deg) translateY(0);}
    to{transform:perspective(700px) rotateX(70deg) translateY(60px);}
}

.container{
    position:relative;
    text-align:center;
    z-index:10;
}

.title{
    font-size:90px;
    font-weight:900;
    color:#00ffff;
    text-transform:uppercase;
    letter-spacing:8px;
    animation:glow 2s infinite alternate;
}

.subtitle{
    margin-top:20px;
    color:#ffffff;
    font-size:18px;
    letter-spacing:6px;
    opacity:.8;
    animation:blink 1.5s infinite;
}

.line{
    width:300px;
    height:3px;
    margin:25px auto;
    background:#00ffff;
    box-shadow:0 0 20px #00ffff;
}

@keyframes glow{
    from{
        text-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff,
        0 0 60px #00ffff;
        transform:scale(1);
    }
    to{
        text-shadow:
        0 0 20px #00ffff,
        0 0 60px #00ffff,
        0 0 120px #00ffff;
        transform:scale(1.05);
    }
}

@keyframes blink{
    50%{
        opacity:.3;
    }
}

.particles span{
    position:absolute;
    width:4px;
    height:4px;
    background:#00ffff;
    border-radius:50%;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    30%{opacity:1;}
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="particles">
<span style="left:10%;animation-delay:0s;"></span>
<span style="left:20%;animation-delay:1s;"></span>
<span style="left:35%;animation-delay:3s;"></span>
<span style="left:50%;animation-delay:2s;"></span>
<span style="left:65%;animation-delay:5s;"></span>
<span style="left:80%;animation-delay:4s;"></span>
<span style="left:92%;animation-delay:6s;"></span>
</div>

<div class="container">
<div class="title">SILENT OWNER</div>
<div class="line"></div>
<div class="subtitle">⚡ ELITE GAMING • CYBER MODE ACTIVATED ⚡</div>
</div>

</body>
  </html>
